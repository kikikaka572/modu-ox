name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          GITHUB_PAGES: "true"
          # Supabase anon key is safe to expose client-side by design —
          # actual data access is gated by Row Level Security, not secrecy.
          VITE_SUPABASE_URL: https://eiqblscewvwvbdxoajpq.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpcWJsc2Nld3Z3dmJkeG9hanBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0Mjk4MzgsImV4cCI6MjEwNzAwNTgzOH0.Bi5vr5XszmoqlYd4y9QeCmuFg3hGn3fRpPROq5yxLM0
        run: npm run build

      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
